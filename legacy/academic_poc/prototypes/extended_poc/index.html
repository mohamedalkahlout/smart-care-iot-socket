<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة تحكم المقابس الذكية</title>
  <style>
    /* ... نفس التنسيقات كما هي ... */
    :root {
      --bg1: #0f2027;
      --bg2: #203a43;
      --bg3: #2c5364;
      --glass: rgba(255, 255, 255, 0.06);
    }
    /* (بقية CSS كما لديك) */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header {
      width: 100%;
      max-width: 900px;
      padding: 18px 10px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      background: linear-gradient(90deg, #00ff80, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #status {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 6px;
      min-height: 18px;
    }
    main {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }
    .card {
      background: var(--glass);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .plug {
      font-size: 56px;
      padding: 12px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }
    .plug.on {
      color: #00ff80;
      box-shadow: 0 0 14px #00ff80, inset 0 0 8px rgba(0, 255, 128, 0.25);
    }
    .plug.off {
      color: #ff6b6b;
      box-shadow: 0 0 10px #ff6b6b;
    }
    .plug.disabled {
      opacity: 0.45;
      pointer-events: none;
      cursor: not-allowed;
      filter: grayscale(0.1);
    }
    .temp {
      font-size: 20px;
      margin-top: 10px;
    }
    label {
      display: block;
      margin-top: 8px;
      font-size: 13px;
    }
    select,
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      margin-top: 6px;
    }
    button {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #00ff80, #00d4ff);
      color: #000;
      font-weight: 700;
      cursor: pointer;
    }
    .small {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <header>
    <h1>💡 لوحة تحكم المقابس الذكية</h1>
    <div id="status">جارٍ الاتصال...</div>
  </header>




  <main>
    <section class="card center">
      <h2>المقبس الرئيسي</h2>
      <div id="socket1-icon" class="plug off" role="button">🔌</div>
      <div id="relay-state-text" class="small">الحالة: غير معروف</div>
      <div id="control-note" class="small">الوضع: --</div>
    </section>


    
    <section class="card center">
      <h2>مستشعر الحرارة (DHT22)</h2>
      <div class="temp"><span id="current-temp">--</span> °C</div>
      <div class="small">آخر قراءة</div>
    </section>

    <section class="card">
      <h2>إعدادات التحكم</h2>
      <label>وضع التحكم</label>
      <select id="mode">
        <option value="manual" style="background-color: #000;">يدوي</option>
        <option value="auto" style="background-color: #000;" >تلقائي</option>
      </select>

      <div id="limits-section" style="margin-top: 12px; display: none;">
        <label>الحد الأدنى (°C)</label>
        <input  id="min-temp" type="number"  step="0.1" inputmode="decimal" lang="en" oninput="this.value = this.value.replace(/[^0-9.]/g, '')" />
        <label>الحد الأقصى (°C)</label>
        <input id="max-temp" type="number" step="0.1" inputmode="decimal" lang="en" oninput="this.value = this.value.replace(/[^0-9.]/g, '')"  />
        <button id="save-limits" > حفظ</button>
      </div>
    </section>

    <section class="card center">
      <h2>مقبس 2 (ماتور المياه)</h2>
      <div class="plug disabled">🔌</div>
      <div class="small">للعرض فقط</div>
    </section>
    <section class="card center">
      <h2>مقبس 3 (التلفاز)</h2>
      <div class="plug disabled">🔌</div>
      <div class="small">للعرض فقط</div>
    </section>
    <section class="card center">
      <h2>مقبس 4 (التكييف)</h2>
      <div class="plug disabled">🔌</div>
      <div class="small">للعرض فقط</div>
    </section>
  </main>

  <script>
    // رابط Realtime Database مع .json
    const baseURL = "https://mohamednael-467e0-default-rtdb.firebaseio.com/sockets/socket1.json";

    const statusEl = document.getElementById("status");
    const plugIcon = document.getElementById("socket1-icon");
    const relayText = document.getElementById("relay-state-text");
    const controlNote = document.getElementById("control-note");
    const currentTempEl = document.getElementById("current-temp");
    const modeSelect = document.getElementById("mode");
    const limitsSection = document.getElementById("limits-section");
    const minTempInput = document.getElementById("min-temp");
    const maxTempInput = document.getElementById("max-temp");

    async function fetchData() {
      try {
        const res = await fetch(baseURL);
        if (!res.ok) throw new Error("خطأ في جلب البيانات");
        const data = await res.json();

        if (data.status === "on") {
          plugIcon.className = "plug on";
          relayText.textContent = "الحالة: يعمل";
        } else {
          plugIcon.className = "plug off";
          relayText.textContent = "الحالة: متوقف";
        }

        controlNote.textContent = `الوضع: ${data.mode === "auto" ? "تلقائي" : "يدوي"}`;
        modeSelect.value = data.mode;
        limitsSection.style.display = data.mode === "auto" ? "block" : "none";

        minTempInput.value = data.minTemp;
        maxTempInput.value = data.maxTemp;
        currentTempEl.textContent = data.currentTemp.toFixed(1);

        statusEl.textContent = "تم الاتصال بنجاح";
      } catch (error) {
        statusEl.textContent = "خطأ في الاتصال بـ Realtime Database";
        console.error(error);
      }
    }

    // تبديل الحالة يدوياً
    plugIcon.addEventListener("click", async () => {
      try {
        const newState = plugIcon.classList.contains("on") ? "off" : "on";
        await fetch("https://mohamednael-467e0-default-rtdb.firebaseio.com/sockets/socket1/status.json", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newState),
        });
        fetchData();
      } catch (error) {
        console.error(error);
      }
    });

    // تغيير الوضع
    modeSelect.addEventListener("change", async () => {
      try {
        await fetch("https://mohamednael-467e0-default-rtdb.firebaseio.com/sockets/socket1/mode.json", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(modeSelect.value),
        });
        fetchData();
      } catch (error) {
        console.error(error);
      }
    });

    // حفظ الحدود
    document.getElementById("save-limits").addEventListener("click", async () => {
      try {
        await fetch("https://mohamednael-467e0-default-rtdb.firebaseio.com/sockets/socket1/minTemp.json", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(parseFloat(minTempInput.value)),
        });
        await fetch("https://mohamednael-467e0-default-rtdb.firebaseio.com/sockets/socket1/maxTemp.json", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(parseFloat(maxTempInput.value)),
        });
        fetchData();
      } catch (error) {
        console.error(error);
      }
    });

    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
